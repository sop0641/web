<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="fullpage.js"></script>
    <link rel="stylesheet" href="fullpage.css" />
    <script>
      window.addEventListener("load", function () {
        new fullpage("#fullpage", {
          //options here
          autoScrolling: true,
          scrollHorizontally: true,
        });
      });
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .section:nth-child(1) {
        width: 100%;
        height: 100vh;
        background: url(./index.png) center/cover;
      }
      .section:nth-child(2) {
        width: 100%;
        height: 100vh;
        background: url(./index1.png) top/cover;
      }
      .section:nth-child(3) {
        width: 100%;
        height: 100vh;
        background: url(./index2.png) top/cover;
      }
      .section:nth-child(4) {
        width: 100%;
        height: 100vh;
        background: url(./index3.png) top/cover;
      }
      .section:nth-child(5) {
        width: 100%;
        height: 100vh;
        background: url(./index4.png) top/cover;
      }
      .section:nth-child(6) {
        width: 100%;
        height: 100vh;
        background: url(./index5.png) top/cover;
      }
    </style>
  </head>
  <body>
    <div id="fullpage">
      <div class="section"></div>
      <div class="section"></div>
      <div class="section"></div>
      <div class="section"></div>
      <div class="section"></div>
      <div class="section"></div>
    </div>
  </body>
</html>
